# to install tmux plugins, run the following command in tmux:
# `prefix + I`

# All keybindings live in bindings.conf, sourced at the very bottom (after TPM).
set-option -g default-terminal 'tmux-256color'         # Set terminal type for 256 color support
set-option -g terminal-overrides ',*:RGB'              # Enable true color support for all terminals

# set-option -g default-shell "/usr/local/bin/bash"
set-option -g default-shell /bin/zsh                # Use zsh for tmux panes

set-option -g prefix C-Space                            # Set prefix to Ctrl+spacebar
set-option -g prefix2 C-\;                              # Second prefix: Ctrl+;
unbind C-b                                              # Remove default Ctrl+b prefix
# SECOND PREFIX, and it is NOT configured here: left_cmd+Space also reaches this
# prefix while Ghostty is frontmost. Command has no encoding in the terminal wire
# protocol, so it cannot be passed through — Karabiner remaps it to a real
# ctrl+space key event before Ghostty ever sees it (`ghostty--` block in
# ~/.config/karabiner.edn). tmux therefore just sees C-Space, and `prefix2`
# remains unspent. Provisional; C-Space stays the only prefix that works outside
# Ghostty or with Karabiner off.
# See ~/.config/docs/adrs/014-tmux-prefix-via-karabiner-app-scoped-remap.md
# `bind-key C-Space send-prefix` moved to bindings.conf (must run after `unbind-key -a`)

set -g base-index 1                                     # Start indexing windows at 1 instead of 0
set -g detach-on-destroy off                            # Don't exit from tmux when closing a session
set -g focus-events on                                  # Forward focus events to apps (enables nvim FocusGained/FocusLost)
set -g display-time 700                                 # Show messages briefly for 300ms
# set -g display-panes-time 300                           # Show pane indicators for 800ms

# remove delay for exiting insert mode with ESC in Neovim # it's fast enough to
# feel instant while avoiding potential terminal sequence conflicts.
set -g escape-time 0                                    # Zero-out escape time delay (use 10 if ESC sequences ever split over SSH)
set -g repeat-time 1000                                 # Window for -r repeatable keys (C-o/C-i cycling)

set -g history-limit 50000
set -g renumber-windows on                              # Renumber all windows when any window is closed
# OFF on purpose: `pbcopy` (via copy-pipe in bindings.conf) is the only clipboard
# writer. With `on`, tmux ALSO emitted OSC 52, and that second writer appended a
# stale payload instead of replacing — one yank produced two clipboard entries,
# the second being `previous clipboard + \n + new text`. `external` does NOT fix
# this: it still sets the terminal clipboard and only ignores inbound sequences.
# Cost: apps that emit OSC 52 themselves (e.g. remote nvim with clipboard=osc52)
# no longer reach the macOS clipboard. Local copy-mode yanks are unaffected.
set -g set-clipboard off                                # pbcopy is the sole clipboard writer
set -g status-position top                              # macOS / darwin style - status bar at top
setw -g mode-keys vi                                    # Use vi-style key bindings in copy mode


set -g mouse on                                         # Enable mouse support

set -g automatic-rename off                          # Disable automatic window renaming (stop the rename whenever you cd)
set-window-option -g allow-rename off               # Disable window renaming (stop the rename whenever you cd)

# Set terminal title to show tmux session name
set -g set-titles on                                # Enable setting terminal title
set -g set-titles-string "#S"                       # Set title to session name

set -g @plugin 'christoomey/vim-tmux-navigator'        # Plugin for seamless vim/tmux pane navigation
# set -g @tmux_navigator_disable_when_zoomed 1          # " Disable tmux navigator when zooming the Vim pane
# set -g @tmux_navigator_save_on_switch 2              # " Write all buffers before navigating from Vim to tmux pane

set -g @fzf-url-fzf-options '--tmux=center,60%,30% --prompt=URL: --border-label=Open-URL'  # FZF URL options
set -g @fzf-url-history-limit '2000'                   # FZF URL history limit
set -g @fzf-url-bind 'o'                                 # Use `o` to open URLs
set -g @fzf-url-open '$HOME/.config/tmux/scripts/open-url-with-copy.sh'  # Custom open: copy to clipboard + open in Firefox


set -g @plugin 'tmux-plugins/tpm'                      # Tmux Plugin Manager
set -g @plugin 'tmux-plugins/tmux-sensible'            # Basic tmux settings everyone can agree on
set -g @plugin 'tmux-plugins/tmux-yank'                # Copy to system clipboard
set -g @plugin 'tmux-plugins/tmux-resurrect'           # Restore tmux environment after restart
set -g @plugin 'tmux-plugins/tmux-continuum'           # Continuous saving of tmux environment
# set -g @plugin 'fcsonline/tmux-thumbs'                 # Copy/paste with vimium/vimperator like hints
set -g @plugin 'sainnhe/tmux-fzf'                      # Use fzf to manage tmux work environment
set -g @plugin 'wfxr/tmux-fzf-url'                     # Quickly open any url on terminal window
set -g @plugin 'catppuccin/tmux'                       # Official theme; drives whole palette from @catppuccin_flavor
set -g @plugin 'omerxx/tmux-floax'                     # Floating terminal window
# DISABLED 2026-11-04 (lag experiment, revisit ~2026-11-08): set -g @plugin 'hiroppy/tmux-agent-sidebar'

# Sidebar auto-create is OFF on purpose. The plugin creates one sidebar pane per
# window, and each sidebar polls every 1s by forking tmux/ps/git/lsof with no
# backoff when its window is hidden (upstream bug, see docs/2026_08_19-sidebar-fork-storm-load-spike.md).
# At 63 windows that was ~40 tmux clients/sec through the single-threaded tmux
# server, driving load1 to 137. Sidebars are now opt-in: prefix `f` for one
# window, prefix `F` for all (both defined in bindings.conf, which supersedes the
# plugin's own e / E). MUST be set before the `run tpm` line at the end of this
# file, because agent-sidebar.conf only seeds its default when unset.
# set -g @sidebar_auto_create off                        # Opt-in sidebars; prevents per-window polling fork storm

# tmux-yank: mouse-drag copying uses pbcopy and STAYs in copy mode.
# `copy-pipe` = stay; default `copy-pipe-and-cancel` = exit. bindings.conf
# overrides the keyboard yank keys: y strips one trailing newline and exits;
# Y strips one trailing newline and stays in copy mode.
set -g @yank_action 'copy-pipe'

# TODO: remap binding for thumbs. right now its prefix spacebar
# thumbs to Prefix+Tab (freeing up Space for layout cycling)
 # set -g @thumbs-key 'Tab'

set -g @floax-width '85%'                              # Floating window width
set -g @floax-height '85%'                             # Floating window height
set -g @floax-border-color 'magenta'                   # Floating window border color
set -g @floax-text-color 'blue'                        # Floating window text color
set -g @floax-bind 'i'                                 # Overridden in bindings.conf -> scripts/floax-left.sh
set -g @floax-change-path 'false'                      # Off on purpose: scripts/floax-left.sh owns directory-following (adr/016)
set -g @floax-bind-menu 'P'                            # additional menu that can be triggered when the floax window is active.
set -g @floax-title 'floax-floating-window-title'       # The title of the floating window
set -g @floax-session-name 'floax-floating-window-session-name'  # The session name of the floating pane. (default is 'scratch')

# TODO: floax: position to the left. or at least make it persist its location
# set -g @floax-x-position 'L'        # Position horizontally: L (left), C (center), R (right)
# set -g @floax-y-position 'C'        # Position vertically: T (top), C (center), B (bottom)

set -g @continuum-restore 'on'                         # Auto-restore the saved tmux environment when the server starts
set -g @continuum-save-interval '15'                   # Continuum: save every 15 minutes instead of constantly
# set -g @resurrect-strategy-nvim 'session'            # Must stay off: auto-session owns nvim state; double-restore caused ~18 orphan nvim processes (adr/003)

set -g @resurrect-processes ':all:'                    # Relaunch saved pane commands (adr/003, amended 2026-09-21)
set -g @resurrect-capture-pane-contents 'on'           # Save/restore pane scrollback

# ============================================================================
# Catppuccin theme (official catppuccin/tmux)
#
# Flavor is the single switch for light/dark, and it follows the system
# appearance. This file still contains no macOS probe: `tmux-theme-sync` owns
# that and drives @catppuccin_flavor from the outside, so everything here stays
# correct over SSH, on Linux, and in any emulator. The value below is only the
# fallback for platforms that cannot be asked.
#
# `prefix T` still forces a flavor by hand; it holds until the system
# appearance next changes (see bindings.conf).
# See ~/.config/docs/adrs/032-follow-system-appearance-across-the-stack.md
# ============================================================================
# `-o` only seeds this when unset, so re-sourcing the config (which both the
# toggle and the sync do) preserves the live flavor instead of snapping back.
set -og @catppuccin_flavor 'mocha'                     # 'mocha' = dark, 'latte' = light

set -g @catppuccin_window_status_style "basic"         # Flat fill, matching the previous look
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_text " #W"                   # Inactive window: name
set -g @catppuccin_window_current_text " #W"           # Active window: name (zoom shown via flags)
set -g @catppuccin_window_flags "icon"                 # Adds the zoom indicator the old config hand-rolled

set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"

# Show current path (tilde-abbreviated) rather than just the basename default.
set -g @catppuccin_directory_text "#(echo '#{pane_current_path}' | sed \"s|^$HOME|~|\")"

set -g @catppuccin_date_time_text " %H:%M"             # Time only (hours:minutes)

set -g status-right-length 120

# Clean slate BEFORE plugins load: strip all default bindings so only plugin
# bindings + our bindings.conf (sourced last) remain. MUST be before `run tpm`,
# otherwise it would wipe the bindings plugins create (floax, agent-sidebar, etc.).
unbind-key -a

# Initialize TMUX plugin manager
run '~/.config/tmux/plugins/tpm/tpm'                   # Load and run tmux plugin manager

# Status line is composed AFTER TPM. The official catppuccin plugin assigns
# status-left/status-right with a plain `set` (not `-ga`), so anything appended
# before TPM is silently discarded — which is exactly what happened to the pane
# count for as long as it lived above. Build the whole line here instead.
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_directory}#{E:@catppuccin_status_date_time}"
# Pane count — persistent signal when sessions are accumulating.
set -ga status-right " #[fg=colour245]│ #[fg=colour208]#{?#{>:#{session_windows},5},⚠ ,}panes: #(tmux list-panes -a 2>/dev/null | wc -l | tr -d ' ')#[fg=default] "
# Follow the system appearance. The probe is quarantined in the script so this
# file stays free of any macOS-specific command (ADR 031's portability rule);
# on Linux and over SSH the script is a no-op. It prints nothing, so it adds no
# visible text to the status line — the status line is just a convenient timer,
# firing every status-interval. It exits early when the flavor already matches,
# so the repeated calls are cheap. client-attached covers the case where the
# appearance changed while no client was attached to tick the status line.
set -ga status-right "#($HOME/.local/bin/tmux-theme-sync)"
set-hook -g client-attached 'run-shell -b "$HOME/.local/bin/tmux-theme-sync"'

# Continuum auto-save is driven by status line evaluation, so it must be last.
set -ga status-right "#($HOME/.config/tmux/plugins/tmux-continuum/scripts/continuum_save.sh)"

# ============================================================================
# Pane focus indication (must come AFTER plugin loading)
#
# Two signals carry focus: background contrast and border color. Background
# contrast is the load-bearing one — it is the only signal that works for panes
# running something other than Neovim (Codex, Claude Code, plain shells), which
# have no internal notion of focus.
#
# Portability rule: the ACTIVE pane is `bg=default`, so it inherits whatever the
# terminal emulator supplies and stays correct in any emulator and both
# appearances. Only the INACTIVE pane names a color, and it references a
# catppuccin palette variable rather than a raw hex, so it follows
# @catppuccin_flavor. Never hardcode a hex here — that is what broke light mode.
#
# Neovim deliberately uses the opposite direction (it *deepens* the active
# split; see nvim/docs/2026-09-19-active-split-focus-treatment.md). Different
# layers answer different questions: tmux says "which pane", nvim says "which
# split", so distinct treatments are intentional.
# ============================================================================
set -gF window-style 'fg=default,bg=#{@thm_mantle}'    # inactive pane: dimmed, theme-derived
set -g  window-active-style 'fg=default,bg=default'    # active pane: inherits terminal theme

# Active border is a filled cell, not a hairline. tmux borders are always
# exactly one cell wide - there is no width control - so the neutral
# fill provides weight. Pure fuchsia on a dark magenta-tinted fill makes the
# whole cell read as fuchsia without becoming the loud solid block of an
# accent background (adr/002). Catppuccin has no saturated fuchsia.
#
# These are the one deliberate raw-hex exception: each color is chosen per
# flavor, so it still follows @catppuccin_flavor. Never use one hex for both.
set -gF pane-active-border-style 'fg=#{?#{==:#{@catppuccin_flavor},latte},#c000a0,#ff00ff},bg=#{?#{==:#{@catppuccin_flavor},latte},#f5c6ec,#6b0f5e}'  # per-flavor fuchsia on tinted fill
set -gF pane-border-style 'fg=#{@thm_overlay_0}'       # inactive border: theme-derived

set -g pane-border-lines single
set -g pane-border-status off

# Copy mode visual indicators
# set -g mode-style 'bg=#ffff00,fg=#000000,bold'          # Bright yellow background with black text for selections
set -g message-style 'bg=#ff00ff,fg=#ffffff,bold'       # Magenta background for copy mode messages
setw -g mode-style 'bg=#ffff00,fg=#000000,bold'         # Ensure window mode style also set

# CRITICAL: Full-width copy mode indicator - MUST be after Catppuccin loads to override it
# This makes the ENTIRE status bar turn bright yellow when in copy mode.
# The non-copy-mode branch is theme-derived rather than `bg=default` so the
# status bar still follows @catppuccin_flavor instead of flattening to the
# terminal background.
set -gF status-style '#{?pane_in_mode,bg=#ffff00 fg=#000000 bold,bg=#{@thm_bg} fg=#{@thm_fg}}'

# ============================================================================
# All keybindings load LAST — after TPM — so they always win over plugin and
# default bindings. This is the single home for every bind; see bindings.conf.
# ============================================================================
source-file ~/.config/tmux/bindings.conf
