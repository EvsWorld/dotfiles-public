# ########## Copy Mode ################
bind -N "Copy mode" 'space'  copy-mode
# left hand
bind -N "Copy mode" d  copy-mode
bind -N "Copy mode" v  copy-mode
bind -N "Copy mode + begin selection" ^v copy-mode \; send-keys -X begin-selection
# right hand
bind -N "Copy mode" ^u  copy-mode
bind -N "Copy mode" ^y  copy-mode

# bind ] paste-buffer                                   #  paste from buffer (disabled - ] now used for prompt navigation)

# Explicitly forces copy mode to use vi-style key bindings
bind -N "Begin selection"                    -T copy-mode-vi v send-keys -X begin-selection
bind -N "Start of line (first non-blank)"    -T copy-mode-vi H send-keys -X back-to-indentation
bind -N "End of line"                        -T copy-mode-vi L send-keys -X end-of-line
bind -N "Clear selection (stay in copy mode)" -T copy-mode-vi C-c send-keys -X clear-selection
bind -N "Exit copy mode"                     -T copy-mode-vi Escape send-keys -X cancel
bind -N "Search forward (incremental)"       -T copy-mode-vi / command-prompt -i -p "(search)" "send -X search-forward-incremental \"%%%\""
bind -N "Block (rectangle) selection"        -T copy-mode-vi C-v send-keys -X begin-selection \; send-keys -X rectangle-toggle

bind -N "Scroll up one line"   -T copy-mode-vi u send-keys -X scroll-up
bind -N "Scroll down one line" -T copy-mode-vi d send-keys -X scroll-down

# Control+/ enters copy mode and starts search immediately.
# Many terminals encode Ctrl+/ as Ctrl+_, so bind both names.
bind -N "Copy mode + incremental search" -n C-/ copy-mode \; command-prompt -i -p "(search)" "send-keys -X search-forward-incremental \"%%%\""
bind -N "Copy mode + incremental search" -n C-_ copy-mode \; command-prompt -i -p "(search)" "send-keys -X search-forward-incremental \"%%%\""

# move down half a page. and prevent Control+D from exiting copy mode at buffer end
bind -N "Half page down" -T copy-mode-vi C-d send-keys -X halfpage-down
bind -N "Half page up"   -T copy-mode-vi C-u send-keys -X halfpage-up

# Mouse wheel scrolls the view while in copy mode (stays in copy mode).
bind -N "Scroll down (mouse wheel)" -T copy-mode-vi WheelDownPane send-keys -X scroll-down
bind -N "Scroll up (mouse wheel)"   -T copy-mode-vi WheelUpPane send-keys -X scroll-up

# Enter copy mode on scroll-up WITHOUT tmux's default `-e` flag. `-e` makes
# scrolling to the bottom auto-exit copy mode; dropping it lets you reach the
# bottom and stay in copy mode, so you decide when/what to copy. (Overrides the
# tmux built-in root WheelUpPane, which survives `unbind-key -a`.)
bind -T root WheelUpPane if-shell -F "#{||:#{alternate_on},#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode }

# Mouse-drag copy is provided by tmux-yank (@yank_action 'copy-pipe' in tmux.conf).

# ########## End Copy Mode ################

# ########## Prompt Navigation ################
# Jump between shell prompts using OSC 133;A marks emitted by zsh (.zshrc).
# Prefix+[ / Prefix+] enter copy mode and jump; inside copy mode, bare [ / ]
# keep jumping.
bind -N "Jump to previous prompt" '[' copy-mode \; send-keys -X previous-prompt
bind -N "Jump to next prompt"     ']' copy-mode \; send-keys -X next-prompt
bind -N "Previous prompt" -T copy-mode-vi '[' send-keys -X previous-prompt
bind -N "Next prompt"     -T copy-mode-vi ']' send-keys -X next-prompt
# ########## End Prompt Navigation ################

