# ============================================================================
# bindings.conf — ALL tmux keybindings live here.
#
# THE ONE RULE: every keybinding goes in this file. It is sourced LAST (after
# TPM in tmux.conf), so any bind here overrides tmux defaults AND plugin
# bindings uniformly. No load-order reasoning required — this file always wins.
#
# `unbind-key -a` stays in tmux.conf BEFORE `run tpm` (clean slate before
# plugins load); do NOT move it here or plugin bindings get wiped.
# ============================================================================

unbind R
bind -N "Reload tmux config" R source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded! Use prefix+I to install new plugins, prefix+U to update."

# Toggle light/dark by hand, overriding the system appearance.
#
# This only sets @theme_override and then hands off to `tmux-theme-sync`; it
# deliberately does not set @catppuccin_flavor or re-source directly. Two
# reasons. The sync re-checks the system appearance every status-interval (5s)
# and would revert a bare flavor change almost immediately, so the override
# flag is what tells it to stand down - it holds until the system appearance
# actually changes, at which point the system reclaims control. And the actual
# repaint requires clearing the @thm_* palette before re-sourcing (see the
# script); duplicating that here would mean two copies to keep correct.
#
# Running Neovim instances do not follow this (they read the system appearance
# once at startup) - restart them to re-theme.
# See ~/.config/docs/adrs/031-theme-aware-focus-indication-across-the-stack.md
unbind T
bind -N "Toggle light/dark theme (latte/mocha)" T \
  if-shell -F '#{==:#{@catppuccin_flavor},mocha}' \
    "set -g @theme_override 'latte' ; run-shell '$HOME/.local/bin/tmux-theme-sync' ; display-message 'Theme: latte (light), manual override'" \
    "set -g @theme_override 'mocha' ; run-shell '$HOME/.local/bin/tmux-theme-sync' ; display-message 'Theme: mocha (dark), manual override'"

