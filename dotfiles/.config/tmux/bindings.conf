# Prefix+w+t / w+T: move the current *window* into another session.
# `choose-tree -s` starts with sessions collapsed, so the picker is a session
# list ordered by last activity, matching the `-O time` pickers on `"` and `M`.
# The placeholder expands to `=<session>:` — a session target with no index — so
# `-a` appends after the destination's active window instead of colliding with an
# index already in use. Without `-a`, expanding a session and picking a *window*
# row would fail with "index in use"; `-a` inserts after it and shifts instead.
#
# Use `%1`, NOT `%%`. tmux's cmd_template_replace() substitutes `%%` only on its
# FIRST occurrence and leaves later ones literal, so a two-command template
# written with `%%` twice fails with "can't find pane %%" on the second command.
# `%1` (placeholder index 1 — the same value) substitutes every occurrence.
#
# `move-window` never moves the *client*, so `t` follows up with `switch-client`
# to travel with the window. `T` uses `-d` and stays put in the current session.
#
# Caveat: moving a session's *last* window destroys that session (tmux
# behavior), so `T`'s "stay here" has nothing to stay in — with
# `detach-on-destroy off` the client gets bounced somewhere arbitrary. Prefer
# `t` when emptying a session; its switch-client lands on the moved window.
bind -N "Move window to another session (follow it)" -T window-ops t \
  choose-tree -s -O time "move-window -a -t '%1' ; switch-client -t '%1'"
bind -N "Move window to another session (follow it)" -T window-ops y \
  choose-tree -s -O time "move-window -a -t '%1' ; switch-client -t '%1'"
bind -N "Move window to another session (stay here)" -T window-ops T \
  choose-tree -s -O time "move-window -a -d -t '%1'"
bind -N "Move window to another session (stay here)" -T window-ops Y \
  choose-tree -s -O time "move-window -a -d -t '%1'"

# Prefix+w+M: move pane interactively as vertical split
bind -N "Move pane into chosen window by last activity (vertical split)" -T window-ops M choose-window -O time "move-pane -h -t '%%'"

