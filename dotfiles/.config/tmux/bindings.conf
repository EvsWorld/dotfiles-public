# Vim detection for smart key forwarding (used by navigation and resize bindings)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

# Tmux resize keybindings matching nvim smart-splits: Ctrl+Option+hjkl,
# and Caps Lock + Option + hjkl (both press orders; see ADR 021 for how
# caps_lock resolves to control+option, which is not unconditional).
# Ghostty encodes the chord as ESC + uppercase, arriving here as M-H/J/K/L --
# tmux never sees the modifiers, only those bytes.
# Check if vim is running, if so pass keys to vim, otherwise resize tmux pane
bind -N "Resize pane left (vim-aware, no prefix)"  -r -T root M-H if-shell "$is_vim" "send-keys M-H" "resize-pane -L 5"
bind -N "Resize pane down (vim-aware, no prefix)"  -r -T root M-J if-shell "$is_vim" "send-keys M-J" "resize-pane -D 2"
bind -N "Resize pane up (vim-aware, no prefix)"    -r -T root M-K if-shell "$is_vim" "send-keys M-K" "resize-pane -U 2"
bind -N "Resize pane right (vim-aware, no prefix)" -r -T root M-L if-shell "$is_vim" "send-keys M-L" "resize-pane -R 5"

# Prefix-based resize fallback, independent of the root-table chord above.
# Uses lowercase M-h/j/k/l (Option+hjkl), so it does not collide with M-H/J/K/L.
bind -N "Resize pane left (repeatable)"  -r M-h resize-pane -L 5
bind -N "Resize pane right (repeatable)" -r M-l resize-pane -R 5
bind -N "Resize pane down (repeatable)"  -r M-j resize-pane -D 2
bind -N "Resize pane up (repeatable)"    -r M-k resize-pane -U 2

