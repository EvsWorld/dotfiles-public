# Copy-mode yank keys:
#   y copies to pbcopy without the final line terminator, then exits copy mode.
#     A selection found in a recent Claude Code reply is replaced by the reply's
#     exact text, undoing Claude's own line wrapping (copy-from-claude.py).
#   Y does the same and stays in copy mode.
#   c cleans terminal-width wrapping/padding for prose, copies, and exits.
#   C cleans terminal-width wrapping/padding for prose, copies, and stays in copy mode.
# These load after TPM, so they override tmux-yank's defaults.
bind-key -N "Copy (Claude text unwrapped) and exit" -T copy-mode-vi y send-keys -X copy-pipe-and-cancel '/usr/bin/python3 $HOME/.config/tmux/scripts/copy-from-claude.py | pbcopy'
bind-key -N "Copy (Claude text unwrapped), stay in copy mode" -T copy-mode-vi Y send-keys -X copy-pipe '/usr/bin/python3 $HOME/.config/tmux/scripts/copy-from-claude.py | pbcopy'
bind-key -N "Copy cleaned prose and exit"       -T copy-mode-vi c send-keys -X copy-pipe-and-cancel '$HOME/.config/tmux/scripts/normalize-prose.sh | pbcopy'
bind-key -N "Copy cleaned prose, stay in copy mode" -T copy-mode-vi C send-keys -X copy-pipe '$HOME/.config/tmux/scripts/normalize-prose.sh | pbcopy'
