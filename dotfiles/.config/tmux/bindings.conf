# ############################################################################
# vim-tmux-navigator no-wrap bindings (MUST be after plugin loads to override)
# These prevent Ctrl+hjkl from wrapping around to opposite edge
# Optimized vim detection - checks pane_current_command first (fast) before ps (slow)
# This reduces shell execution overhead by ~90% in common cases
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="\
echo '#{pane_current_command}' | grep -iqE '^${vim_pattern}$' && exit 0
echo '#{pane_current_command}' | grep -iqE '^(bash|zsh|fish)$' && exit 1
ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind-key -N "Pane left (vim-aware, no wrap)"  -n C-h if-shell "$is_vim" "send-keys C-h" "if-shell -F '#{pane_at_left}' '' 'select-pane -L'"
bind-key -N "Pane down (vim-aware, no wrap)"  -n C-j if-shell "$is_vim" "send-keys C-j" "if-shell -F '#{pane_at_bottom}' '' 'select-pane -D'"
bind-key -N "Pane up (vim-aware, no wrap)"    -n C-k if-shell "$is_vim" "send-keys C-k" "if-shell -F '#{pane_at_top}' '' 'select-pane -U'"
bind-key -N "Pane right (vim-aware, no wrap)" -n C-l if-shell "$is_vim" "send-keys C-l" "if-shell -F '#{pane_at_right}' '' 'select-pane -R'"

# Control+U enters copy mode; Control+D scrolls down half a page (MUST be after plugin loads)
# - aoe popup/dashboard: pass through for fzf navigation
# - vim/nvim: pass through
# - any other alternate-screen app (opencode, git diff pagers, ...):
#   C-u enters tmux copy mode; C-d sends the app its native PageDown
#   NOTE: Claude Code is set to `"tui": "default"` in ~/.claude/settings.json
#   (classic inline renderer) so its transcript lands in tmux scrollback and
#   C-u/C-d take the copy-mode path like every other primary-screen app.
# - everything else (primary screen): C-u enters tmux copy mode without moving;
#   C-d enters copy mode and scrolls down half a page
bind-key -N "Scroll up / copy mode (routed by app)" -n C-u if-shell -F '#{||:#{==:#{session_name},aoe-popup},#{==:#{window_name},aoe-dashboard}}' \
  'send-keys C-u' \
  "if-shell \"$is_vim\" 'send-keys C-u' 'copy-mode'"

bind-key -N "Scroll down half page (routed by app)" -n C-d if-shell -F '#{||:#{==:#{session_name},aoe-popup},#{==:#{window_name},aoe-dashboard}}' \
  'send-keys C-d' \
  "if-shell \"$is_vim\" 'send-keys C-d' \"if-shell -F '#{alternate_on}' 'send-keys PageDown' 'copy-mode ; send-keys -X halfpage-down'\""

