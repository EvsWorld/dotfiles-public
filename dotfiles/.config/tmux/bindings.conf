unbind r
bind -N "Rename window"   r command-prompt "rename-window %%"
bind -N "Rename session"  '$' command-prompt "rename-session %%"
bind -N "Detach from session" F8 detach
bind -N "Last session (toggle back and forth)" h switch-client -l
bind -N "Previous session by order (jump-list back)"  -r C-o switch-client -p
bind -N "Next session by order (jump-list forward)"   -r C-i switch-client -n
bind -N "sesh: session picker" n run-shell $HOME/.config/tmux/scripts/sesh.sh
# ########## End Session Related ################

